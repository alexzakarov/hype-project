version: '3.8'

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

services:

  # =========================================================
  # SERVER 1 - MAIN APPLICATION
  # =========================================================

  server1:
    platform: linux/amd64

    build:
      context: ./
      dockerfile: Dockerfile

    container_name: server1
    restart: always

    depends_on:

      # PRIMARY DATABASE
      postgresql:
        condition: service_healthy

      # MONGODB
      mongodb:
        condition: service_healthy

      # EVENT STORE
      kurrentdb.db:
        condition: service_healthy

      # ELASTICSEARCH
      node01:
        condition: service_healthy

      # OBSERVABILITY
      otel-collector:
        condition: service_started

    environment:
      OTEL_ENDPOINT: otel-collector:4317

      # PostgreSQL
      ConnectionStrings__PostgreSQL: "Host=postgresql;Port=5432;Database=hype-project;Username=postgres;Password=123456"

      # MongoDB
      ConnectionStrings__MongoDB: "mongodb://admin:admin@mongodb:27017"

      # KurrentDB
      KurrentDB__ConnectionString: "esdb://kurrentdb.db:2113?tls=false&gossipTimeout=20"

      # Elasticsearch
      Elasticsearch__Url: "http://node01:9200"

    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"

    ports:
      - "5010:5010"
      - "5001:5001"
      - "50051:50051"
      - "8001:8001"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # KURRENTDB
  # =========================================================

  kurrentdb.db:
    image: docker.kurrent.io/kurrent-latest/kurrentdb:latest
    container_name: kurrentdb
    restart: always

    environment:
      KURRENTDB_CLUSTER_SIZE: 1
      KURRENTDB_RUN_PROJECTIONS: All
      KURRENTDB_START_STANDARD_PROJECTIONS: "true"
      KURRENTDB_INSECURE: "true"
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: "true"

    ports:
      - "2113:2113"

    volumes:
      - kurrentdb-volume-data:/var/lib/kurrentdb
      - kurrentdb-volume-logs:/var/log/kurrentdb

    networks:
      - microservices

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:2113/health/live || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    logging: *default-logging


  # =========================================================
  # POSTGRESQL - PRIMARY APPLICATION DATABASE
  # =========================================================

  postgresql:
    image: postgres:16
    container_name: postgresql
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: hype-project

    ports:
      - "5432:5432"

    volumes:
      - postgresql-data:/var/lib/postgresql/data

    networks:
      - microservices

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d hype-project"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"


  # =========================================================
  # MONGODB
  # =========================================================

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGODB_DATABASE: products

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data_container:/data/db

    networks:
      - microservices

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username admin --password admin --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging: *default-logging


  # =========================================================
  # ELASTICSEARCH
  # =========================================================

  node01:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: node01
    restart: always

    environment:
      node.name: node01
      cluster.name: es-cluster-7
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms128m -Xmx128m"

    ulimits:
      memlock:
        soft: -1
        hard: -1

    volumes:
      - es-data01:/usr/share/elasticsearch/data

    ports:
      - "9200:9200"

    networks:
      - microservices

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    logging: *default-logging


  # =========================================================
  # KIBANA
  # =========================================================

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.29
    container_name: kibana
    restart: always

    environment:
      ELASTICSEARCH_HOSTS: http://node01:9200

    depends_on:
      node01:
        condition: service_healthy

    ports:
      - "5601:5601"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # OTEL COLLECTOR
  # =========================================================

  otel-collector:
    image: otel/opentelemetry-collector:0.101.0
    container_name: otel-collector
    restart: always

    command:
      - "--config=/etc/otel-collector.yaml"

    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro

    ports:
      - "4320:4317"
      - "4321:4318"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # TEMPO
  # =========================================================

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    restart: always

    command:
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - ./tempo-data:/var/tempo

    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
      - "14268:14268"
      - "9411:9411"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # PROMETHEUS
  # =========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always

    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"

    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # LOKI
  # =========================================================

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: always

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    ports:
      - "3100:3100"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # PROMTAIL
  # =========================================================

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: always

    depends_on:
      loki:
        condition: service_started

    volumes:
      - ./promtail.yaml:/etc/promtail/docker-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      - "-config.file=/etc/promtail/docker-config.yaml"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # GRAFANA
  # =========================================================

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: always

    depends_on:
      prometheus:
        condition: service_started

      tempo:
        condition: service_started

      loki:
        condition: service_started

    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor

    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana

    ports:
      - "3000:3000"

    networks:
      - microservices

    logging: *default-logging


  # =========================================================
  # NODE EXPORTER
  # =========================================================

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: always

    ports:
      - "9101:9100"

    networks:
      - microservices

    logging: *default-logging


# =========================================================
# VOLUMES
# =========================================================

volumes:

  kurrentdb-volume-data:

  kurrentdb-volume-logs:

  mongodb_data_container:

  es-data01:

  prometheus-data:

  grafana-data:

  postgresql-data:


# =========================================================
# NETWORK
# =========================================================

networks:

  microservices:
    name: microservices
    driver: bridge