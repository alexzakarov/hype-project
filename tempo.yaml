server:
  http_listen_port: 3200
  log_level: info

query_frontend:
  max_retries: 2

distributor:
  receivers:

    otlp:
      protocols:

        grpc:
          endpoint: 0.0.0.0:4317

        http:
          endpoint: 0.0.0.0:4318

    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_http:
          endpoint: 0.0.0.0:14268

    zipkin:
      endpoint: 0.0.0.0:9411

storage:
  trace:
    backend: local

    wal:
      path: /var/tempo/wal

    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose

  storage:
    path: /var/tempo/generator/wal

    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:

    metrics_generator:
      processors:
        - service-graphs
        - span-metrics