apiVersion: v1
kind: Service
metadata:
  name: kurrentdb
  labels:
    app: kurrentdb
spec:
  clusterIP: None # headless service for StatefulSet stable identity
  selector:
    app: kurrentdb
  ports:
    - name: http
      port: 2113
      targetPort: 2113
      protocol: TCP
    - name: tcp
      port: 1113
      targetPort: 1113
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: kurrentdb-service
  labels:
    app: kurrentdb
spec:
  selector:
    app: kurrentdb
  ports:
    - name: http
      protocol: TCP
      port: 2113
      targetPort: 2113
    - name: tcp
      protocol: TCP
      port: 1113
      targetPort: 1113
  type: ClusterIP
